# Defaults for a plain `mvnw spring-boot:run` (local Ollama).
# Pick a profile to override:
#   dev  -> local Ollama for chat and embeddings (same as these defaults)
#   prod -> container + Ollama cloud API, no local Ollama (SPRING_PROFILES_ACTIVE=prod)
spring.application.name=ama

spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:31b-cloud
spring.ai.ollama.embedding.options.model=nomic-embed-text

log-dir=/tmp/ama