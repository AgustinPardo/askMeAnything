# Local development (default profile): chat + embeddings served by a local Ollama.
# Production uses the "prod" + "cloud" profiles (see application-cloud.properties).

spring.application.name=ama

spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:31b-cloud
spring.ai.ollama.embedding.options.model=nomic-embed-text

# GitHub MCP server binary (spawned over stdio). Path to the github-mcp-server release.
mcp.github.binary=${GITHUB_MCP_BINARY:/usr/local/bin/github-mcp-server}
github.token=${GITHUB_TOKEN:}

# Meteoro MCP server (streamable HTTP)
spring.ai.mcp.client.streamable-http.connections.meteoro.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.meteoro.endpoint=/mcp
# Connect lazily: the Meteoro server is started manually in its own terminal.
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=30s