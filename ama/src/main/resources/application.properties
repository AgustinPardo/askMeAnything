# Settings shared by every environment.
# A profile is always required (it decides which chat/embedding model is used):
#   dev  -> local Ollama   (mvnw spring-boot:run -Dspring-boot.run.profiles=dev)
#   prod -> Ollama cloud API (SPRING_PROFILES_ACTIVE=prod)
spring.application.name=ama

# Used when nothing sets spring.profiles.active (e.g. running from the IDE),
# so exactly one ChatModel/EmbeddingModel is created.
spring.profiles.default=dev

# Same MCP client wiring everywhere; the server location is set per profile.
spring.ai.mcp.client.streamable-http.connections.meteoro.endpoint=/mcp
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=30s
github.token=${GITHUB_TOKEN:}

# Log files tailed by LogController (/api/logs/...)
log-dir=/tmp/ama