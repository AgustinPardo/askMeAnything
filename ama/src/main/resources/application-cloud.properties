# Cloud profile: chat and tool calling go to Ollama's HOSTED API.
# No Ollama server has to run anywhere: AMA calls https://ollama.com/v1 directly.
#
# Enable with:  SPRING_PROFILES_ACTIVE=prod,cloud
#
# Required secret: OLLAMA_API_KEY (https://ollama.com/settings/keys)

spring.ai.openai.base-url=https://ollama.com/v1
spring.ai.openai.api-key=${OLLAMA_API_KEY:}

# Cloud model ids come from https://ollama.com/api/tags (no ":cloud" suffix)
spring.ai.openai.chat.options.model=${OLLAMA_CHAT_MODEL:gemma4:31b}
spring.ai.openai.chat.options.temperature=0.8

spring.ai.model.chat=openai

# Embeddings are disabled here: Ollama's hosted API has no embeddings endpoint,
# so the RAG mode reports that it is unavailable instead of failing.
spring.ai.model.embedding=none