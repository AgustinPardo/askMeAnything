# Container profile: port, paths and internal MCP wiring for the Docker image.
# Combine with "cloud" to use Ollama's hosted API:  SPRING_PROFILES_ACTIVE=prod,cloud

server.port=${PORT:7860}

# GitHub MCP server binary (spawned over stdio, downloaded during the image build)
mcp.github.binary=/app/bin/github-mcp-server
github.token=${GITHUB_TOKEN:}

# Meteoro MCP server: same container, loopback only (not exposed)
spring.ai.mcp.client.streamable-http.connections.meteoro.url=http://127.0.0.1:8081
spring.ai.mcp.client.streamable-http.connections.meteoro.endpoint=/mcp
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=30s

logging.level.io.modelcontextprotocol=WARN
logging.level.com.ap.ama=INFO