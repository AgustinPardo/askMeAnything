# Container profile (Render / Docker): runs two JVMs in one container and talks to
# Ollama's HOSTED API, so no Ollama server runs in the container.
#
#   SPRING_PROFILES_ACTIVE=prod
#
# Required secret: OLLAMA_API_KEY (https://ollama.com/settings/keys)

server.port=${PORT:7860}

# --- Model: Ollama cloud API (OpenAI-compatible), no Ollama server needed ---
spring.ai.openai.base-url=https://ollama.com/v1
spring.ai.openai.api-key=${OLLAMA_API_KEY:}
# Cloud model ids come from https://ollama.com/api/tags (no ":cloud" suffix)
spring.ai.openai.chat.options.model=${OLLAMA_CHAT_MODEL:gemma4:31b}
spring.ai.openai.chat.options.temperature=0.8
spring.ai.model.chat=openai
# Embeddings are disabled: the hosted API has no embeddings endpoint, so RAG reports
# that it is unavailable instead of failing.
spring.ai.model.embedding=none

# --- GitHub MCP server binary (spawned over stdio, downloaded during the image build) ---
mcp.github.binary=/app/bin/github-mcp-server
github.token=${GITHUB_TOKEN:}

# --- Meteoro MCP server: same container, loopback only (not exposed) ---
spring.ai.mcp.client.streamable-http.connections.meteoro.url=http://127.0.0.1:8081
spring.ai.mcp.client.streamable-http.connections.meteoro.endpoint=/mcp
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=30s

# --- Logs: files tailed by LogController (/api/logs/ama, /api/logs/meteoro) ---
log-dir=/tmp/ama

logging.level.io.modelcontextplatform=WARN
logging.level.com.ap.ama=INFO
# Shows the model requests/responses (prompts included) in /api/logs/ama
logging.level.org.springframework.ai.openai=DEBUG