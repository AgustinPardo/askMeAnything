# Local development: everything served by a local Ollama.
#   mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Prereqs:
#   ollama serve
#   ollama pull gemma4:31b-cloud      (chat, requires a signed-in Ollama)
#   ollama pull nomic-embed-text      (embeddings for RAG)

spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:31b-cloud
spring.ai.ollama.embedding.options.model=nomic-embed-text

# GitHub MCP server binary (spawned over stdio)
mcp.github.binary=${GITHUB_MCP_BINARY:/usr/local/bin/github-mcp-server}
github.token=${GITHUB_TOKEN:}

# Meteoro MCP server (streamable HTTP), started manually in its own terminal
spring.ai.mcp.client.streamable-http.connections.meteoro.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.meteoro.endpoint=/mcp
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=30s

# Log files tailed by LogController (the entrypoint writes them here)
log-dir=/tmp/ama